<!doctype html><html><head><meta charset="utf-8"><title>Jewish Learning Academy · Chullin Recall</title><link rel="stylesheet" href="canon-labs.css"></head><body><main><p class="lesson-label">TERM TWO · DAILY RECALL</p><h1>Recall the limit that clarifies a rule.</h1><p class="prompt">When a source gives an exception after a broad rule, what should you ask?</p><div class="choices" id="a"></div><p id="f"></p></main><script>const x=['Who or what does the exception limit, and what does that reveal about the rule’s scope?','How can I ignore the rule entirely?','Why is every exception unrelated?'].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);a.innerHTML=x.map(({t,i})=>`<button class="choice" data-i="${i}">${t}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===0;document.querySelectorAll('[data-i]').forEach(q=>q.disabled=true);f.innerHTML=ok?'<span class="feedback">+10 XP. Tomorrow, retrieve how Sanhedrin connects category to stakes.</span><a class="continue" href="term-two-recall-sanhedrin.html">Continue recall →</a>':'<button class="continue" onclick="location.reload()">Try again →</button>'})</script></body></html>
