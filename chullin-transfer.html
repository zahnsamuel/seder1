<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seder · Chullin transfer</title><link rel="stylesheet" href="canon-labs.css"></head><body><main><p class="lesson-label">CHULLIN · UNSEEN TRANSFER</p><h1>Read the limit without losing the rule.</h1><article class="source"><p class="citation">Mishnah Megillah 1:1</p><p>A town reads the Megillah earlier when it lacks ten idle people.</p><a href="https://www.sefaria.org/Mishnah_Megillah.1.1" target="_blank" rel="noopener">Read the source on Sefaria ↗</a></article><p class="prompt">What is the Chullin reading habit here?</p><div class="choices" id="answers"></div><p id="feedback"></p></main><script src="seder-auth.js?v=2"></script><script>const a=['Name the normal rule, identify the condition that changes its application, then ask what concern the condition protects.','Treat the special condition as proof there is no rule.','Ignore the condition and memorize only the result.'].map((text,index)=>({text,index})).sort(()=>Math.random()-.5);document.querySelector('#answers').innerHTML=a.map(({text,index})=>`<button class="choice" data-a="${index}">${text}</button>`).join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.a===0;document.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');document.querySelector('#feedback').innerHTML=ok?'<span class="feedback">+15 XP. A condition can clarify the scope and purpose of a rule.</span><a class="continue" href="chullin-arc.html">Return to Chullin →</a>':'<button class="continue" onclick="location.reload()">Try again →</button>'});</script></body></html>
