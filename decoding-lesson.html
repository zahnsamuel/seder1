<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jewish Learning Academy · Decoding lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jla-system.css">
  <style>
    .jla-main > .jla-eyebrow { margin: 8px 0 14px; }
    .decoding-drill {
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }
    .decoding-lesson-title {
      font-family: var(--jla-font-display);
      color: var(--jla-accent-ink);
      font-size: clamp(1.35rem, 3vw, 1.7rem);
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1.2;
      margin: 0 0 18px;
      max-width: 640px;
    }
    .decoding-status {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--jla-text-soft);
    }
    .decoding-status #band {
      font: 700 .68rem/1 var(--jla-font-body);
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .decoding-meter { flex: 1; min-width: 48px; }
    .decoding-status #count {
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .decoding-drill .prompt {
      color: var(--jla-accent-ink);
      font: 600 1.08rem/1.45 var(--jla-font-display);
      margin: 0;
    }
    .decoding-answers { display: grid; gap: 2px; }
    .decoding-drill #continue { align-self: flex-start; margin-top: 4px; }
    .decoding-drill #continue:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .decoding-this-lesson {
      margin-top: 8px;
      max-width: 640px;
    }
    .decoding-this-lesson > summary {
      cursor: pointer;
      color: var(--jla-text-soft);
      font-size: .88rem;
      font-weight: 600;
      padding: 10px 0;
      list-style: revert;
    }
    .decoding-this-lesson > summary:hover { color: var(--jla-accent-ink); }
    .decoding-this-lesson[open] > summary { margin-bottom: 8px; }
    .decoding-this-lesson ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .decoding-this-lesson li {
      padding: 8px 0;
      border-bottom: 1px solid var(--jla-border);
      color: var(--jla-text-soft);
      font-size: .85rem;
    }
    .decoding-this-lesson li.active { color: var(--jla-accent-ink); font-weight: 600; }
    .decoding-this-lesson li.done::before { content: "✓ "; color: var(--jla-ok); }
    .mastery {
      background: var(--jla-secure-bg);
      border: 1px solid var(--jla-secure-line);
      border-radius: var(--jla-r-lg);
      padding: clamp(24px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }
    .mastery h2 {
      font-family: var(--jla-font-display);
      color: var(--jla-accent-ink);
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      letter-spacing: -.03em;
      margin: 0;
    }
    .mastery p {
      color: var(--jla-text-soft);
      font-size: 1.02rem;
      line-height: 1.6;
      margin: 0;
      max-width: 46ch;
    }
    @media (max-width: 720px) {
      .decoding-drill #continue { width: 100%; min-height: 44px; }
      .mastery .jla-btn { width: 100%; min-height: 44px; }
    }
  </style>
</head>
<body class="jla">
  <div id="jla-shell-mount" data-links='[{"label":"The ladder","href":"hebrew-decoding.html"}]'></div>
  <strong id="xp" hidden>0 XP</strong>
  <main class="jla-main">
    <p class="jla-eyebrow">DECODING</p>
    <h1 id="band-title" class="decoding-lesson-title">Learn to read Hebrew, one letter at a time.</h1>
    <section class="lesson decoding-drill" aria-live="polite">
      <div class="decoding-status">
        <span id="band">LETTERS</span>
        <div class="jla-meter decoding-meter" aria-hidden="true"><i id="bar"></i></div>
        <small id="count">1 / 9</small>
      </div>
      <div class="glyph-card jla-glyph-card">
        <p id="glyph" class="glyph jla-glyph" lang="he" dir="rtl"></p>
        <button id="hear" class="hear jla-hear" type="button" hidden>Hear it</button>
      </div>
      <p id="prompt" class="prompt"></p>
      <div id="answers" class="answers decoding-answers"></div>
      <p id="feedback" class="feedback"></p>
      <button id="continue" class="jla-btn jla-btn-primary" type="button" disabled>Continue →</button>
      <details class="decoding-this-lesson">
        <summary>This lesson</summary>
        <ul id="map"></ul>
      </details>
    </section>
  </main>
  <script src="seder-auth.js?v=2"></script>
  <script src="capability-state.js"></script>
  <script src="jla-shell.js"></script>
  <script src="decoding-drills.js?v=1"></script>
  <script src="decoding-engine.js?v=3"></script>
  <script src="feedback.js?v=1"></script>
</body>
</html>
