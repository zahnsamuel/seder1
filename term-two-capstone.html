<!doctype html><html><head><meta charset="utf-8"><title>Seder · Term Two Capstone</title><link rel="stylesheet" href="canon-labs.css"></head><body><main><p class="lesson-label">SECOND FOUNDATION TERM · CAPSTONE</p><h1>Different sources demand different reading habits.</h1><p class="prompt">Which map correctly matches the source to its first reasoning move?</p><div class="choices" id="a"></div><p id="f"></p><p class="lesson-label">STUDY BOUNDARY</p><p>This is a reading-skills capstone, not personal legal, judicial, or pastoral guidance.</p></main><script>const x=['Ketubot: ask what a fixed detail protects; Chullin: identify how an exception defines scope; Sanhedrin: map category, court structure, and stakes.','Use one identical reading move for all three sources.','Treat fixed details, exceptions, and court size as unrelated facts.'].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);a.innerHTML=x.map(({t,i})=>`<button class="choice" data-i="${i}">${t}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===0;document.querySelectorAll('[data-i]').forEach(q=>q.disabled=true);f.innerHTML=ok?'<span class="feedback">+30 XP. You can select the reading habit the source actually needs.</span><a class="continue" href="journey.html">Return to My Journey →</a>':'<button class="continue" onclick="location.reload()">Try again →</button>'})</script></body></html>
