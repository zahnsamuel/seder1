<!doctype html><html><head><meta charset="utf-8"><title>Jewish Learning Academy · Term Two Recall</title><link rel="stylesheet" href="canon-labs.css"></head><body><main><p class="lesson-label">TERM TWO · DAILY RECALL</p><h1>Bring back the move, not just the fact.</h1><p class="prompt">Which question fits a fixed schedule in Ketubot?</p><div class="choices" id="a"></div><p id="f"></p></main><script>const x=['What institutional or human concern is this detail designed to protect?','Which weekday sounds most inspiring?','Does the date mean the source has no reasoning?'].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);a.innerHTML=x.map(({t,i})=>`<button class="choice" data-i="${i}">${t}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===0;document.querySelectorAll('[data-i]').forEach(q=>q.disabled=true);f.innerHTML=ok?'<span class="feedback">+10 XP. Tomorrow, recall Chullin’s limit and Sanhedrin’s stakes.</span><a class="continue" href="daily-recall.html">Open daily recall queue →</a>':'<button class="continue" onclick="location.reload()">Try again →</button>'})</script></body></html>
