<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seder &middot; Sugya notebook</title><link rel="stylesheet" href="canon-labs.css"><link rel="stylesheet" href="notebook.css"></head><body><header><a href="seder.html">Seder</a><span>SUGYA NOTEBOOK</span><a href="daily-router.html">Today</a></header><main><section class="hero"><p>MAKE YOUR READING VISIBLE</p><h1>Build a sugya map in your own words.</h1><div>Record the case, the pressure, the reason or response, unfamiliar vocabulary, and your own explanation. This is a study record, not a ruling on practice.</div></section><section class="lesson"><label>Source or daf<input id="source" placeholder="For example: Berakhot 2a"></label><label>Case: what is happening?<textarea id="case"></textarea></label><label>Question or pressure: what needs explaining?<textarea id="question"></textarea></label><label>Response, reason, or evidence<textarea id="response"></textarea></label><label>Words to retain<textarea id="words" placeholder="Hebrew/Aramaic word — meaning"></textarea></label><label>Your explanation<textarea id="explanation" placeholder="Explain the sugya move in your own words."></textarea></label><button id="save" class="continue">Save sugya map</button><p id="feedback" aria-live="polite"></p></section><section id="entries" class="dashboard-note"></section></main><script src="seder-auth.js?v=2"></script><script src="sugya-notebook.js"></script></body></html>
