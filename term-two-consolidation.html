<!doctype html><html><head><meta charset="utf-8"><title>Jewish Learning Academy · Term Two Consolidation</title><link rel="stylesheet" href="canon-labs.css"></head><body><main><p class="lesson-label">SECOND FOUNDATION TERM · CONSOLIDATION</p><h1>Retrieve the pattern before advancing.</h1><p class="prompt">Which pair correctly distinguishes the two reading habits?</p><div class="choices" id="a"></div><p id="f"></p></main><script>const x=['Ketubot asks what purpose a fixed detail serves; Chullin asks how an exception defines a rule’s scope.','Ketubot and Chullin ask exactly the same question.','Ketubot ignores reasons; Chullin ignores limits.'].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);a.innerHTML=x.map(({t,i})=>`<button class="choice" data-i="${i}">${t}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===0;document.querySelectorAll('[data-i]').forEach(q=>q.disabled=true);f.innerHTML=ok?'<span class="feedback">+20 XP. You can now distinguish two different Gemara habits.</span><a class="continue" href="journey.html">Return to My Journey →</a>':'<button class="continue" onclick="location.reload()">Try again →</button>'})</script></body></html>
