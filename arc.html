<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jewish Learning Academy · Arc</title>
  <link rel="stylesheet" href="jla-system.css">
  <style>
    /* Phase-4 arc template: one page renders any tractate from /api/arc/:tractate. */
    body { margin: 0; background: var(--jla-cream); color: var(--jla-ink); font-family: var(--jla-font-body); }
    .arc { max-width: 720px; margin: auto; padding: 40px 24px 72px; }
    .arc-head h1 { font-family: var(--jla-font-display); color: var(--jla-accent-ink); font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.03em; margin: 8px 0 10px; text-wrap: balance; }
    .arc-intro { color: var(--jla-muted); line-height: 1.6; margin: 0 0 8px; }
    .arc-outcome { background: var(--jla-surface); border: 1px solid var(--jla-line); border-left: 3px solid var(--jla-accent); border-radius: var(--jla-r-sm); padding: 14px 18px; margin: 18px 0 8px; }
    .arc-outcome .l { font: 700 .66rem/1 var(--jla-font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--jla-accent); }
    .arc-outcome h2 { font-family: var(--jla-font-display); color: var(--jla-accent-ink); font-size: 1.2rem; margin: 6px 0 4px; }
    .arc-outcome p { color: var(--jla-muted); font-size: .9rem; margin: 0; }
    .arc-count { font: 700 .68rem/1 var(--jla-font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--jla-text-soft); margin: 30px 0 12px; }
    .arc-card { background: var(--jla-surface); border: 1px solid var(--jla-line); border-radius: var(--jla-r-md); padding: 18px 20px; margin: 0 0 14px; box-shadow: var(--jla-shadow-1); }
    .arc-card .kicker { display: block; color: var(--jla-accent); font: 800 .66rem/1 var(--jla-font-body); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
    .arc-card h3 { color: var(--jla-accent-ink); font: 600 1.18rem/1.15 var(--jla-font-display); margin: 0 0 8px; }
    .arc-card .copy { color: var(--jla-muted); font-size: .9rem; line-height: 1.5; margin: 0 0 12px; }
    .arc-card .open { font-size: .82rem; font-weight: 700; text-decoration: none; color: var(--jla-accent-ink); }
    .arc-source .tr { color: var(--jla-muted); font-size: .92rem; line-height: 1.55; margin: 8px 0 0; }
    .arc-prompt { color: var(--jla-accent-ink); font: 600 1rem/1.4 var(--jla-font-body); margin: 14px 0 10px; }
    .lesson-error, .loading { color: var(--jla-muted); padding: 20px 0; }
  </style>
</head>
<body class="jla">
  <div id="jla-shell-mount"></div>
  <main class="arc">
    <header class="arc-head">
      <p class="jla-eyebrow" id="arc-kicker"></p>
      <h1 id="arc-title">Loading the arc…</h1>
      <p class="arc-intro" id="arc-intro"></p>
      <div class="arc-outcome" id="arc-outcome" hidden></div>
    </header>
    <p class="arc-count" id="arc-count"></p>
    <section id="arc-sessions"><p class="loading">Loading sessions…</p></section>
  </main>
  <script src="seder-auth.js?v=2"></script>
  <script src="capability-state.js"></script>
  <script src="jla-shell.js"></script>
  <script src="arc.js"></script>
</body>
</html>
