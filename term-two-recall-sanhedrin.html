<!doctype html><html><head><meta charset="utf-8"><title>Seder · Sanhedrin Recall</title><link rel="stylesheet" href="canon-labs.css"></head><body><main><p class="lesson-label">TERM TWO · DAILY RECALL</p><h1>Recall why stakes change structure.</h1><p class="prompt">What does Sanhedrin’s different court sizes require you to map?</p><div class="choices" id="a"></div><p id="f"></p></main><script>const x=['The case category, the court structure, and why the stakes may require that difference.','Only the largest number.','A personal ruling for the learner.'].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);a.innerHTML=x.map(({t,i})=>`<button class="choice" data-i="${i}">${t}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===0;document.querySelectorAll('[data-i]').forEach(q=>q.disabled=true);f.innerHTML=ok?'<span class="feedback">+10 XP. Term Two’s core habits are active for review.</span><a class="continue" href="daily-recall.html">Return to daily recall →</a>':'<button class="continue" onclick="location.reload()">Try again →</button>'})</script></body></html>
