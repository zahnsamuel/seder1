<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jewish Learning Academy · Course progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jla-system.css">
  <link rel="stylesheet" href="jla-next-action.css">
  <link rel="stylesheet" href="canon-labs.css">
  <link rel="stylesheet" href="course-dashboard.css?v=2">
  <link rel="stylesheet" href="canon-source-sequences.css">
</head>
<body class="jla">
  <div id="jla-shell-mount"></div>
  <main class="jla-main">
    <p class="jla-eyebrow jla-na-eyebrow">COURSE PROGRESS</p>
    <section class="jla-next-action" data-course-next>
      <h1 id="next-title">Your next course move</h1>
      <p id="next-copy">Each course is a connected strand of one Jewish canon. Resume the first undemonstrated move.</p>
      <a class="jla-next-action__cta" id="next-cta" href="daily-router.html">Return to Today →</a>
      <small class="jla-progress" id="next-progress"></small>
    </section>
    <section class="dashboard-summary" id="summary" hidden></section>
    <details class="jla-disclose">
      <summary>See all courses</summary>
      <div id="courses" class="course-grid"></div>
    </details>
    <details class="jla-disclose">
      <summary>See canon connections</summary>
      <section id="convergence" class="dashboard-note">
        <p class="lesson-label">GEMARA AND CANON CONVERGE</p>
        <p>Loading the sources that reinforce each other in your next study move.</p>
      </section>
      <section id="source-sequences" class="dashboard-note"></section>
    </details>
  </main>
  <script src="seder-auth.js?v=2"></script>
  <script src="capability-state.js"></script>
  <script src="jla-shell.js"></script>
  <script src="journey-sync.js"></script>
  <script src="course-dashboard.js?v=2"></script>
  <script src="course-connections.js"></script>
  <script src="canon-source-sequences.js"></script>
</body>
</html>
