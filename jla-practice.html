<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jewish Learning Academy · Practice</title>
  <link rel="stylesheet" href="jla-system.css">
  <style>
    /* Page-local layout only; all visual tokens come from jla-system.css (--jla-*). */
    body { margin: 0; background: var(--jla-cream); color: var(--jla-ink); font-family: var(--jla-font-body); }
    .practice { max-width: 680px; margin: auto; padding: 40px 24px 72px; }
    .practice-head h1 { font-family: var(--jla-font-display); color: var(--jla-accent-ink); font-size: clamp(1.7rem, 4vw, 2.4rem); letter-spacing: -.04em; margin: 6px 0 8px; }
    .teaching { color: var(--jla-muted); line-height: 1.55; margin: 0 0 22px; }
    .source-card { margin: 20px 0 26px; }
    .source-ref { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .source-ref b { font: 600 .95rem var(--jla-font-body); color: var(--jla-accent-ink); }
    .source-ref a { font-size: .78rem; font-weight: 700; text-decoration: none; color: var(--jla-accent); white-space: nowrap; }
    .source-tr { color: var(--jla-muted); font-size: .95rem; line-height: 1.6; margin: 10px 0 0; }
    .source-context { color: var(--jla-muted); font-size: .82rem; font-style: italic; margin: 12px 0 0; }
    .prompt { color: var(--jla-accent-ink); font: 600 1.1rem/1.4 var(--jla-font-display); margin: 0 0 14px; }
    .advance { display: flex; justify-content: flex-end; margin-top: 18px; }
    .done-card { text-align: center; }
    .done-card .jla-chip { margin: 14px auto 0; }
    .loading, .lesson-error { color: var(--jla-muted); padding: 24px 0; }
  </style>
</head>
<body class="jla">
  <div id="jla-shell-mount"></div>
  <main class="practice">
    <div class="practice-head">
      <span class="jla-eyebrow" id="eyebrow">Source practice</span>
      <h1 id="title">Loading a source…</h1>
      <p class="teaching" id="teaching"></p>
    </div>
    <div id="stage"><p class="loading">Finding a source to read…</p></div>
  </main>
  <script src="seder-auth.js?v=2"></script>
  <script src="capability-state.js"></script>
  <script src="jla-shell.js"></script>
  <script src="jla-practice.js"></script>
</body>
</html>
