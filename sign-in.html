<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Seder</title><link rel="stylesheet" href="seder.css?v=3"><style>main{max-width:560px;margin:9rem auto;padding:0 1.5rem}.sign-in{background:#f5f0e6;border:1px solid #d8cdbb;padding:2rem;border-radius:14px}.sign-in label{display:block;margin:1rem 0 .35rem;font:500 .76rem/1 Inter,sans-serif;letter-spacing:.1em}.sign-in input{box-sizing:border-box;width:100%;padding:.85rem;border:1px solid #b9ad9d;border-radius:6px;font:1rem Inter,sans-serif}.sign-in button{margin-top:1.25rem;width:100%;padding:.9rem;border:0;border-radius:6px;background:#143e48;color:white;font-weight:600}.sign-in p{line-height:1.55;color:#574f45}</style></head><body><header><a href="seder.html">ס Seder</a><span>SECURE LEARNER ACCOUNT</span></header><main><section class="sign-in"><span>CONTINUE YOUR PATH</span><h1>Sign in to save real progress.</h1><p>Your mastery, reviews, and XP stay private to your account. We’ll email you a secure sign-in link—no password required.</p><form id="signIn"><label for="name">DISPLAY NAME (OPTIONAL)</label><input id="name" name="name" autocomplete="name"><label for="email">EMAIL</label><input id="email" name="email" type="email" autocomplete="email" required><button>Send secure sign-in link</button></form><p id="status" aria-live="polite"></p><p id="localFallback" hidden style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #d8cdbb"><a href="profile.html" style="color:#276b68;font-weight:600">Continue without an account →</a><br><small style="color:#8a8071">Progress saves to this device only, under a local profile.</small></p></section></main><script src="seder-auth.js?v=1"></script><script>document.querySelector('#signIn').addEventListener('submit',async(e)=>{e.preventDefault();const d=new FormData(e.currentTarget),s=document.querySelector('#status');s.textContent='Sending your secure link…';try{await Seder.sendMagicLink(d.get('email'),d.get('name'));s.textContent='Check your inbox. The link will bring you back to Seder.'}catch(error){s.textContent=error.message}});Seder.config().then((config)=>{if(!config.supabaseUrl||!config.supabaseAnonKey)document.querySelector('#localFallback').hidden=false})</script></body></html>
