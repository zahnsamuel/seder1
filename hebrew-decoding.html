<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jewish Learning Academy · Hebrew Decoding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jla-system.css">
  <link rel="stylesheet" href="jla-next-action.css">
  <style>
    [data-decoding-next] {
      background: var(--jla-surface);
      border: 1px solid var(--jla-line);
      border-radius: var(--jla-r-lg);
      box-shadow: var(--jla-shadow-1);
      padding: clamp(28px, 5vw, 52px);
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    [data-decoding-next] h1 {
      font-family: var(--jla-font-display);
      color: var(--jla-accent-ink);
      font-size: clamp(1.9rem, 4.5vw, 2.9rem);
      line-height: 1.05;
      letter-spacing: -.03em;
      margin: 0;
      text-wrap: balance;
    }
    [data-decoding-next] p {
      color: var(--jla-text-soft);
      font-size: 1.08rem;
      line-height: 1.6;
      margin: 0;
      max-width: 46ch;
    }
    .decoding-progress {
      color: var(--jla-text-soft);
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .decoding-ladder {
      margin-top: var(--jla-sp-6);
      max-width: 640px;
    }
    .decoding-ladder > summary {
      cursor: pointer;
      color: var(--jla-text-soft);
      font-size: .88rem;
      font-weight: 600;
      padding: 10px 0;
      list-style: revert;
    }
    .decoding-ladder > summary:hover { color: var(--jla-accent-ink); }
    .decoding-ladder[open] > summary { margin-bottom: 16px; }
    .dl-band { margin: 0 0 22px; }
    .dl-band-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 11px; }
    .dl-band-head span { font: 600 11px var(--jla-font-body); letter-spacing: .12em; color: var(--jla-accent); }
    .dl-band-head h2 { font-family: var(--jla-font-display); font-weight: 600; color: var(--jla-accent-ink); font-size: 1.25rem; margin: 0; }
    .dl-lessons { display: grid; gap: 9px; }
    .dl-lesson { display: flex; align-items: center; gap: 14px; background: var(--jla-surface); border: 1px solid var(--jla-border); border-radius: 12px; padding: 13px 16px; text-decoration: none; }
    .dl-lesson.current { border-color: var(--jla-accent); box-shadow: var(--jla-shadow-1); }
    .dl-lesson.done { background: var(--jla-secure-bg); border-color: var(--jla-secure-line); }
    .dl-lesson.review { background: var(--jla-emerging-bg); border-color: var(--jla-emerging-line); }
    .dl-badge { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--jla-border); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--jla-ok); flex-shrink: 0; }
    .dl-lesson.done .dl-badge { background: var(--jla-secure-bg); border-color: var(--jla-secure-line); }
    .dl-lesson.review .dl-badge { background: var(--jla-emerging-bg); border-color: var(--jla-emerging-line); color: var(--jla-emerging-ink); }
    .dl-body { flex: 1; }
    .dl-body strong { display: block; font-family: var(--jla-font-display); font-weight: 600; color: var(--jla-accent-ink); font-size: 1.02rem; }
    .dl-body small { color: var(--jla-text-soft); font-size: .72rem; letter-spacing: .06em; }
    .dl-go { font: 600 12px var(--jla-font-body); color: var(--jla-accent-ink); white-space: nowrap; }
    @media (max-width: 720px) {
      [data-decoding-next] { max-width: none; width: 100%; padding: 24px 18px; }
      .decoding-ladder { max-width: none; }
      .dl-go { display: none; }
    }
  </style>
</head>
<body class="jla">
  <div id="jla-shell-mount"></div>
  <main class="jla-main">
    <p class="jla-eyebrow jla-na-eyebrow">DECODING</p>
    <section class="jla-next-action" data-decoding-next>
      <h1 id="decoding-title">Learn to read Hebrew from the very beginning.</h1>
      <p id="decoding-copy">Before you can read a source you have to decode it — recognize each letter and its sound, then each vowel, then blend them into words. Short lessons, one glyph at a time, in Modern Hebrew pronunciation.</p>
      <a class="jla-next-action__cta" id="continue-cta" href="decoding-lesson.html">Start decoding →</a>
      <small class="decoding-progress" id="ladder-progress"></small>
    </section>
    <details class="decoding-ladder">
      <summary>See the full ladder</summary>
      <div id="ladder"></div>
    </details>
  </main>
  <script src="seder-auth.js?v=2"></script>
  <script src="capability-state.js"></script>
  <script src="jla-shell.js"></script>
  <script src="decoding-drills.js?v=1"></script>
  <script src="decoding-index.js?v=2"></script>
</body>
</html>
