<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jewish Learning Academy · Source Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jla-system.css">
  <link rel="stylesheet" href="source-reader.css">
</head>
<body class="jla">
  <div id="jla-shell-mount" data-links='[{"label":"Notebook","href":"notebook.html"},{"label":"Mastery map","href":"canon-map.html"}]'></div>
  <main class="jla-main">
    <p class="jla-eyebrow">SOURCE</p>
    <h1 id="title" class="reader-title">Loading source</h1>
    <p id="connection" class="reader-connection"></p>
    <section id="focus" class="reading-focus" aria-live="polite">
      <small>FOCUS IN THE SOURCE</small>
      <strong>Choose a line to see its reading move.</strong>
      <p>Notice who speaks, what’s claimed, and what kind of source it is.</p>
    </section>
    <section id="reader" class="reader jla-card"></section>
    <details class="reader-passages">
      <summary>Other passages</summary>
      <nav id="collection-nav"></nav>
    </details>
  </main>
  <script src="seder-auth.js?v=2"></script>
  <script src="capability-state.js"></script>
  <script src="jla-shell.js"></script>
  <script src="source-reader.js"></script>
  <script src="source-reader-language.js"></script>
</body>
</html>
