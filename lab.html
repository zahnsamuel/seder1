<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Seder - Tractate Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lab.css?v=2">
</head>
<body>
  <header><a href="/">ס Seder</a><span>INTERACTIVE DAF LAB</span><a href="shas-map-v2.html?v=2">Full Shas map</a><strong id="xp">0 XP</strong></header>
  <main>
    <section class="lab-head"><div><span id="lab-status">LOADING REVIEWED SOURCE</span><h1 id="title">Tractate lab</h1><p id="focus"></p></div><a id="source-link" target="_blank" rel="noreferrer">Open source reference ↗</a></section>
    <section class="study-shell">
      <article class="daf-workspace" aria-label="Interactive source page">
        <div class="daf-toolbar"><span id="reference"></span><button id="translate" type="button">Show translations</button></div>
        <div class="daf-frame">
          <div class="margin-note left-note">CLICK A LINE<br>TO STUDY IT</div>
          <section class="daf-text" id="daf-text" lang="he" dir="rtl" aria-label="Source text"></section>
          <div class="margin-note right-note">SOURCE FIRST<br>THEN QUESTION</div>
        </div>
        <div class="translation-drawer" id="translation-drawer" hidden><span>LINE IN ENGLISH</span><p id="translation"></p></div>
        <div class="source-note"><span>WHAT YOU ARE PRACTICING</span><strong id="kind"></strong></div>
      </article>
      <section class="practice-panel"><div class="progress"><span id="progress">LINE 1 OF 3</span><strong id="lab-xp">0 XP</strong></div><h2 id="step-title"></h2><p id="prompt"></p><div class="answers" id="answers"></div><p id="feedback" aria-live="polite"></p><button class="continue" id="continue" type="button" disabled>Continue →</button></section>
    </section>
    <section class="footnote"><span>EDITORIAL STATUS</span><p id="editorial"></p></section>
  </main>
  <script src="seder-auth.js?v=1"></script>
  <script src="lab.js?v=3"></script>
</body>
</html>
